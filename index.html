<script>
const THEMES=[
{id:"t1",label:"War",colour:"#3C3489",pale:"#EEEDFE",text:"#26215C",icon:"⚔️",summary:"Barker explores war not as glory but as a machine that consumes sanity, identity and moral integrity.",keyPoints:["War is fought at a remove — Craiglockhart, not the Front, is the setting","The 'Great Adventure' myth vs the reality of passive, feminine trench life","Sassoon: the war is prolonged by 'political errors and insincerities' (p. 5)","Rivers embodies the moral tension — he knows the war must go on yet is horrified by its cost"],evidence:["'recovery meant the resumption of activities that were not merely self-destructive but positively suicidal.' (p. 318)","'he knew Rivers shared the horror, and shared too the conviction that, in spite of everything, it had to go on.' (p. 117)"],connects:["Duty & loyalty","Paternalism","Trauma"]},
{id:"t2",label:"Duty & loyalty",colour:"#185FA5",pale:"#E6F1FB",text:"#042C53",icon:"🎖",summary:"Duty to the war and duty to individual men are placed in irreconcilable conflict throughout the novel.",keyPoints:["Sassoon's dissent redefines duty: loyalty to suffering soldiers over loyalty to a futile war","Rivers' duty to heal conflicts with the institutional duty to return men to the Front","Prior's shame at 'permanent home service' (p. 279) shows duty internalised as identity"],evidence:["'the therapy was a test, not only of the genuineness of the individual's symptoms, but also of the validity of the demands the war was making on him.' (p. 156)"],connects:["War","Paternalism","Conscience"]},
{id:"t3",label:"Trauma & shell shock",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🧠",summary:"Shell shock is the novel's central subject — a psychological injury produced by the war that the masculine code makes unspeakable.",keyPoints:["Symptoms: mutism (Prior), nightmares (Sassoon), hallucinations, tremors","The culture demanded 'emotional repression as the essence of manliness' (p. 65)","Rivers believes shell shock is caused by the war, not innate weakness","Dreams and hallucinations bring the Front into Craiglockhart structurally"],evidence:["'The story was one Rivers was well used to hearing: healthy fear had given way to indifference...' (p. 244)","'prolonged strain, immobility and helplessness that did the damage' (p. 297)"],connects:["Masculinity","Psychoanalysis","Dreams"]},
{id:"t4",label:"Masculinity & emasculation",colour:"#534AB7",pale:"#EEEDFE",text:"#26215C",icon:"🪬",summary:"The Edwardian masculine ideal — stoic, silent, courageous — both caused shell shock and prevented its treatment.",keyPoints:["Men trained to see emotional repression as manliness — making psychological injury invisible","The hospital itself is 'a fairly emasculating experience' (p. 39)","Prior's hypermasculinity is defence; Burns' nakedness in the field is renunciation","'men over the same period had shrunk into a smaller and smaller space' (p. 123)"],evidence:["'They'd been trained to identify emotional repression as the essence of manliness' (p. 65)","'the war that had promised so much in the way of manly activity had actually delivered feminine passivity' (p. 146)"],connects:["Identity","Gender roles","Trauma"]},
{id:"t5",label:"Gender roles & women",colour:"#993556",pale:"#FBEAF0",text:"#4B1528",icon:"⚖️",summary:"War temporarily reverses gender roles — women expand while men shrink — but both know it cannot last.",keyPoints:["Women in munitions factories: economic independence, agency, autonomy","Madge warns 'All this won't last' (p. 149)","Sarah's anger at men 'hidden away' — the country must face its cost","Lizzie: her husband's absence has been 'the only little bit of peace [she'd] ever had' (p. 149)"],evidence:["'[women] seemed to have changed so much during the war, to have expanded in all kinds of ways' (p. 123)","'if the country demanded that price, then it should bloody well be prepared to look at the result.' (p. 215)"],connects:["Masculinity","Class","War"]},
{id:"t6",label:"Regeneration",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🦋",summary:"Regeneration — the novel's title — is both a medical process and a structural irony: recovery enables return to damage.",keyPoints:["Derived from Henry Head's nerve regeneration research (protopathic before epicritic)","'the process of transformation consists almost entirely of decay' (p. 246) — the chrysalis","Recovery looks like deterioration","Who is truly regenerated? The patients — or Rivers himself?"],evidence:["'charted the progress of regeneration' (p. 63)","'the process of transformation consists almost entirely of decay' (p. 246)","'he, who was in the business of changing people, should himself have been changed' (p. 333)"],connects:["Healing","Identity","Transformation"]},
{id:"t7",label:"Identity, sanity & madness",colour:"#854F0B",pale:"#FAEEDA",text:"#412402",icon:"🪞",summary:"The novel destabilises the boundary between sanity and madness — who is truly sane in a world that wages industrial war?",keyPoints:["Sassoon's 'insanity' is a rational, coherent moral protest","The soldiers' symptoms are sane responses to an insane situation","Prior's mutism is a literal enactment of masculine culture's demand: silence","Being labelled mad is used to silence dissent — political, not medical"],evidence:["'misguided [as] the Declaration might well be ... it was not deluded, illogical or incoherent' (p. 12)"],connects:["Trauma","Psychoanalysis","Paternalism"]},
{id:"t8",label:"Alienation & belonging",colour:"#888780",pale:"#F1EFE8",text:"#2C2C2A",icon:"🧭",summary:"Characters are alienated from civilian society, from other soldiers, and — most painfully — from themselves.",keyPoints:["Soldiers cannot communicate the scale of their experience to those at home","Burns in civilian clothes: handed white feathers despite his discharge","Sarah naming 'Loos' to Prior — one word bridges a gulf no explanation could cross"],evidence:["'people who didn't go to France... aren't going to count for anything' (p. 181)"],connects:["War","Class","Identity"]},
{id:"t9",label:"Poetry as therapy & protest",colour:"#3B6D11",pale:"#EAF3DE",text:"#173404",icon:"✍️",summary:"Poetry is both a form of therapy and Barker's vehicle for anti-war argument.",keyPoints:["Sassoon's poems reproduced intertextually — functioning as testimony","Owen writes at Craiglockhart under Sassoon's mentorship — creative recovery","Poetry names what direct speech cannot — it gives form to formless horror"],evidence:["Sassoon's poem 'To the Warmongers' (p. 35): forthright denunciation of those who perpetuate dangerous war myths"],connects:["War","Speech & silence","Healing"]},
{id:"t10",label:"Dreams",colour:"#534AB7",pale:"#EEEDFE",text:"#26215C",icon:"💭",summary:"Dreams are both a therapeutic tool and a structural device — revealing what the masculine code suppresses.",keyPoints:["~15 dreams and hallucinations across the novel — structural, not incidental","Rivers analyses patients' dreams through a Freudian lens","Rivers' own dream at Queen Square places him in Yealland's chair — his unconscious moral verdict","Dreams allow Barker to bring the Front into Craiglockhart without leaving the hospital"],evidence:["'the dream action had been both an accurate representation of Yealland's treatment and uncomfortably like an oral rape' (p. 316)","'self-reproach... became the dominant effect' (p. 316)"],connects:["Psychoanalysis","Trauma","Speech & silence"]},
{id:"t11",label:"Role of the psychiatrist",colour:"#185FA5",pale:"#E6F1FB",text:"#042C53",icon:"🩺",summary:"Rivers occupies an impossible position: a healer whose success serves a system he increasingly doubts.",keyPoints:["Rivers' method (talking cure) is the exact inversion of Yealland's electric shock","Therapeutic success returns men to the source of their trauma — structural complicity","His own psychosomatic symptoms (stammer, anxiety) mark him as both healer and patient"],evidence:["'Attention, first and foremost; tongue, last and least; questions, never' (p. 302)","'self-reproach... became the dominant effect' (p. 316)"],connects:["Paternalism","Psychoanalysis","Trauma"]},
{id:"t12",label:"Conscience & principle",colour:"#993C1D",pale:"#FAECE7",text:"#4A1B0C",icon:"⚡",summary:"Barker presents conscience as both a burden and a form of courage — the refusal to be complicit.",keyPoints:["Sassoon's Declaration is the novel's defining act of principled conscience","Rivers' growing self-reproach is his conscience asserting itself against his institutional role","Conscience without power is dangerous — Sassoon is hospitalised for his"],evidence:["'I am making this statement as an act of wilful defiance of military authority' (p. 5)"],connects:["Duty","Dissent","Paternalism"]},
{id:"t13",label:"Sexuality & relationships",colour:"#D4537E",pale:"#FBEAF0",text:"#4B1528",icon:"🌹",summary:"Sexuality — hetero and homosexual — is entangled with identity, class, and the war's disruption of norms.",keyPoints:["Sassoon's homosexuality is present but oblique — Carpenter's The Intermediate Sex (p. 73) is his reference","Prior's aggressive heterosexuality functions as both desire and masculine performance","Rivers warns greater tolerance for homosexuality is unlikely to persist in wartime (p. 272)"],evidence:["Sassoon on The Intermediate Sex: he 'wasn't just a freak. That there was a positive side' (p. 74)"],connects:["Masculinity","Identity","Class"]},
{id:"t14",label:"Father/son relationships",colour:"#854F0B",pale:"#FAEEDA",text:"#412402",icon:"👴",summary:"The novel's paternalistic structures are expressed through father/son dynamics and the Abraham/Isaac motif.",keyPoints:["Rivers acts as a paternal figure — particularly to Sassoon and Prior","The Abraham/Isaac church window: the patriarchal bargain exposed as worthless","'all patriarchal societies' are founded on obedience exchanged for inheritance that never comes"],evidence:["'all patriarchal societies' (p. 200)"],connects:["Paternalism","Class","Masculinity"]},
{id:"t15",label:"Nature & the outdoors",colour:"#3B6D11",pale:"#EAF3DE",text:"#173404",icon:"🌿",summary:"Nature is both restorative and triggering — it can heal and it can ambush.",keyPoints:["Brock's ergotherapy: 'the way back to health is to re-establish the link between oneself and the earth' (p. 166)","Burns at the beach: nature soothes but the bus sounds 'like machine-gun fire' (p. 51)","The restorative power of nature carries a subtext about the feminine vs the masculine war world"],evidence:["'the way back to health is to re-establish the link between oneself and the earth' (p. 166)","'a branch [that] rattled along the windows [of the bus] with a sound like machine-gun fire' (p. 51)"],connects:["Healing","Trauma","Regeneration"]},
{id:"t16",label:"Healing & its nature",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🌱",summary:"Barker presents healing as painful, ironic, and morally ambiguous — recovery is not simple restoration.",keyPoints:["Three approaches: Rivers (talking cure), Brock (ergotherapy), Yealland (electric shock) — three views of what soldiers are","True healing requires confronting trauma — but this confrontation is painful","Healing that restores the soldier-self is not true regeneration if that self returns to the source of damage"],evidence:["'recovery meant the resumption of activities that were not merely self-destructive but positively suicidal.' (p. 318)","'often the early stages of change or cure may mimic deterioration' (p. 246)"],connects:["Regeneration","Psychoanalysis","Paternalism"]},
{id:"t17",label:"Empathy & care",colour:"#D4537E",pale:"#FBEAF0",text:"#4B1528",icon:"🤝",summary:"Rivers' empathy is genuine — and is also what makes his complicity so painful.",keyPoints:["Rivers visits Burns in Suffolk out of personal care, not institutional duty","His ability to listen contrasted sharply with Yealland's coercive silence","Empathy does not exempt Rivers from complicity — it makes his position more tragic"],evidence:["Rivers visits Burns personally: 'There was nothing more he could do for Burns.' (p. 54) — but he goes anyway"],connects:["Healing","Paternalism","Father/son"]},
{id:"t18",label:"Transformation",colour:"#3C3489",pale:"#EEEDFE",text:"#26215C",icon:"🔄",summary:"Transformation is the novel's deepest subject — not of bodies but of moral understanding.",keyPoints:["Rivers is more transformed by his patients than they are by him","'he, who was in the business of changing people, should himself have been changed' (p. 333)","Burns' scene in the field: stripping the uniform — renunciation of the soldier-self"],evidence:["'he, who was in the business of changing people, should himself have been changed and by somebody who was clearly unaware of having done it.' (p. 333)"],connects:["Regeneration","Identity","Conscience"]},
{id:"t19",label:"Speech & silence",colour:"#444441",pale:"#F1EFE8",text:"#2C2C2A",icon:"🤐",summary:"Speech and silence are the novel's central therapeutic and political axes — who can speak, and what can be said?",keyPoints:["Prior's mutism: the body enacting what the masculine code demands","Rivers' method predicated on speech — recovering voice recovers self","Stammering: the body's resistance to speaking the unspeakable","Yealland's method restores physical speech but silences the patient's voice"],evidence:["'Attention, first and foremost; tongue, last and least; questions, never' (p. 302)"],connects:["Trauma","Masculinity","Poetry"]},
{id:"t20",label:"Psychoanalysis vs electric shock",colour:"#185FA5",pale:"#E6F1FB",text:"#042C53",icon:"⚕️",summary:"The contrast between Rivers and Yealland: what shell shock patients are — people or instruments.",keyPoints:["Rivers: talking cure, trust, time, the patient's voice — treats soldiers as human beings","Yealland: electric shock, coercion, silence — treats soldiers as malfunctioning machines","Both 'cure' — but Yealland removes the symptom without addressing the cause","Rivers' dream places him in Yealland's chair: even humane treatment serves the same purpose"],evidence:["'Attention, first and foremost; tongue, last and least; questions, never' (p. 302)","'the dream action had been both an accurate representation of Yealland's treatment and uncomfortably like an oral rape' (p. 316)"],connects:["Healing","Paternalism","Role of psychiatrist"]},
{id:"t21",label:"Class & gender dynamics",colour:"#5F5E5A",pale:"#F1EFE8",text:"#2C2C2A",icon:"🏛",summary:"Class and gender intersect throughout — shaping who fights, who heals, and who is believed.",keyPoints:["Officers (Rivers' patients) are educated, articulate — able to navigate the medical system","Prior resents the class that has always had access to privilege","Women's wartime expansion is class-inflected: factory workers vs officers' wives","The medical hierarchy mirrors the military hierarchy"],evidence:["'people who didn't go to France... aren't going to count for anything' (p. 181)"],connects:["Masculinity","Gender","Paternalism"]},
];

const SYMBOLS=[
{id:"s1",label:"Regeneration (title & nerve research)",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🔬",summary:"The title is both literal (Head's nerve research) and ironic — regeneration serves the system that caused the damage.",detail:"Henry Head's experiment on nerve regeneration provides the novel's central scientific metaphor. Recovery proceeds in stages: protopathic sensation (crude, painful) precedes epicritic (nuanced). The irony: recovered patients are returned to the Front.",passages:["'charted the progress of regeneration' (p. 63)","'the process of transformation consists almost entirely of decay' (p. 246)"]},
{id:"s2",label:"Mutism & stammering",colour:"#444441",pale:"#F1EFE8",text:"#2C2C2A",icon:"🤐",summary:"Mutism is the body refusing to speak the unspeakable — both symptom and political statement.",detail:"Prior's mutism is a physical manifestation of what the masculine code demands: silence. Stammering (Owen, Sassoon, Rivers himself) is the body's resistance to speaking experiences that have no adequate language. Yealland's 'cure' restores physical speech but silences the patient's voice.",passages:["Prior's mutism — recovered through Rivers' talking cure","Yealland: 'tongue, last and least; questions, never' (p. 302)"]},
{id:"s3",label:"Physical & mental wounds",colour:"#A32D2D",pale:"#FCEBEB",text:"#501313",icon:"🩹",summary:"The novel insists psychological wounds are as real and visible as physical wounds.",detail:"Prior's mutism, Burns' inability to eat, Sassoon's nightmares — rendered with bodily specificity equal to battle injuries. This challenges the view that shell shock is weakness: the body does not lie.",passages:["Burns: 'mud-encumbered boots like lead weights pulling on the muscles of his thighs' (p. 51)","Prior's eye: the 'gobstopper' — synecdoche for the reality of fragmented human flesh"]},
{id:"s4",label:"Trenches, mud & No Man's Land",colour:"#5F5E5A",pale:"#F1EFE8",text:"#2C2C2A",icon:"⛏",summary:"Trenches are symbolic graves — deep furrows in the earth that men live in and emerge from to die.",detail:"Barker does not set the novel in the trenches — they appear through dreams, hallucinations and testimony. This displacement makes them more present, not less. Mud drowns, clings, erases the individual soldier.",passages:["Burns' thighs 'remembered the mud' — sensory intrusion of the Front into the present","'literally sitting in a hole in the ground doing as you were told or waiting to be killed' (Nixon & Barker)"]},
{id:"s5",label:"The horse's bit",colour:"#854F0B",pale:"#FAEEDA",text:"#412402",icon:"🐴",summary:"Rivers dreams he is forcing a bit into a soldier's mouth — his role as controller revealed.",detail:"The bit symbolises control and coercion. In Rivers' nightmare, he forces a horse's bit into a restrained soldier's mouth. The image conflates doctor with torturer, treatment with coercion. When he wakes, he must confront what this reveals about his work.",passages:["Rivers' nightmare: forcing a bit into a soldier's mouth","The bit as synecdoche for all military control of soldiers' bodies and voices"]},
{id:"s6",label:"Yellow",colour:"#BA7517",pale:"#FAEEDA",text:"#412402",icon:"💛",summary:"Yellow symbolises the war's poison — cowardice, toxicity, and the dehumanising impact on soldiers and civilian workers.",detail:"For soldiers: jaundiced skin was associated with cowardice — yet it results from war's psychological destruction. For munitions workers: yellow skin from TNT exposure — synecdoche for the war's toxic reach into the home front.",passages:["Yellow-skinned patients at Craiglockhart — read as cowardice, actually victims of war","Munitions factory women: yellow skin from TNT — synecdoche for the all-encompassing, toxic war"]},
{id:"s7",label:"Church window: Abraham & Isaac",colour:"#3C3489",pale:"#EEEDFE",text:"#26215C",icon:"🪟",summary:"The patriarchal bargain — obedience in exchange for inheritance — is exposed as worthless.",detail:"Rivers observes this church window on leave and reads it as an emblem of 'all patriarchal societies': the young obey and sacrifice themselves in exchange for future power. But the soldiers dying in trenches reveal the bargain as fraudulent.",passages:["'all patriarchal societies' (p. 200)","'If you, who are young and strong... will obey me... in the course of time you will peacefully inherit' — but they are dying in trenches instead"]},
{id:"s8",label:"Yellow flowers & chrysanthemums",colour:"#BA7517",pale:"#FAEEDA",text:"#412402",icon:"🌸",summary:"Yellow flowers appear at moments of psychological significance — linking beauty, death, and mourning.",detail:"Yellow chrysanthemums are flowers of mourning in European tradition. Their appearance in the novel marks moments where loss is present but not spoken — both consoling and disturbing.",passages:["Yellow flowers at key moments of grief and unspoken loss"]},
{id:"s9",label:"The eyeball ('gobstopper')",colour:"#A32D2D",pale:"#FCEBEB",text:"#501313",icon:"👁",summary:"Prior's attempt to domesticate a trench horror by calling it a 'gobstopper' — the attempt and its failure.",detail:"Prior describes finding a human eyeball and comparing it to a gobstopper. This synecdoche embodies the soldier's attempt to render the unbearable familiar — and its absolute failure. Soldiers are never abstract: they are fragmented human bodies.",passages:["Prior's eyeball — described as a 'gobstopper' to render it familiar","Synecdoche: human flesh as object — the novel's insistence on the bodily reality of war's cost"]},
{id:"s10",label:"Craiglockhart Hospital",colour:"#185FA5",pale:"#E6F1FB",text:"#042C53",icon:"🏥",summary:"Simultaneously sanctuary, prison, and the site where the war's moral failures become visible.",detail:"Craiglockhart is where the 'political errors and insincerities' named in Sassoon's Declaration are walking the corridors — stammering, mute, hallucinating. Patients must keep wearing uniforms and military ranks, even in recovery.",passages:["Patients must wear uniforms and military ranks even in hospital (p. 134)","Barker shifts her focus 'from the obvious site of the battlefront to the more oblique, hidden battlefront of the mental hospital' (Nixon & Barker, p. 7)"]},
{id:"s11",label:"Barbed wire at the Suffolk coast",colour:"#5F5E5A",pale:"#F1EFE8",text:"#2C2C2A",icon:"🌊",summary:"The war has contaminated even the most restorative landscape of home.",detail:"When Rivers visits Burns at the Suffolk coast, he finds barbed wire on the beach — the defensive fortifications of the home front. Even the most healing landscape Barker offers cannot be simply peaceful. The coast is a military boundary.",passages:["Barbed wire on the Suffolk beach — the war's reach into every space of potential respite","Burns at the beach: nature is both restorative and a trigger for trauma"]},
{id:"s12",label:"Prior's asthma",colour:"#854F0B",pale:"#FAEEDA",text:"#412402",icon:"💨",summary:"Prior's body refuses to conform to the strong-man ideal — class, masculinity and physical failure intersect.",detail:"Prior got to France with severe asthma because they 'couldn't afford to be fussy' (p. 84). His asthma marks him as someone who should not be there by the standards of masculine physical ideality — and his shame at this is entangled with his class position.",passages:["Prior gets to France with asthma — 'couldn't afford to be fussy' (p. 84)"]},
{id:"s13",label:"Siegfried's German name",colour:"#3C3489",pale:"#EEEDFE",text:"#26215C",icon:"🏷",summary:"A famous British anti-war poet bearing a German name — the quiet irony of national identity.",detail:"Siegfried is a name from Germanic mythology. That Sassoon bears it is one of Barker's quiet ironies: it suggests the arbitrariness of national identity, the absurdity of nations killing each other over distinctions that are, at the individual level, meaningless.",passages:["Rivers uses both 'Sassoon' and 'Siegfried' in his thoughts","The German name as a constant ironic presence in a war fought against Germany"]},
{id:"s14",label:"The chrysalis / caterpillar",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🦋",summary:"Transformation looks like decay. Recovery looks like deterioration.",detail:"Rivers draws on the chrysalis to explain therapeutic paradox: inside, the caterpillar dissolves before reforming. For shell shock patients, breakdown can precede breakthrough. This is also true of Rivers' own moral transformation.",passages:["'the process of transformation consists almost entirely of decay' (p. 246)","'often the early stages of change or cure may mimic deterioration' (p. 246)"]},
{id:"s15",label:"Emasculation",colour:"#534AB7",pale:"#EEEDFE",text:"#26215C",icon:"🪖",summary:"The hospital, shell shock, and home service all represent masculine failure in a culture that defines men by fighting.",detail:"Being in a psychiatric hospital was 'a fairly emasculating experience' (p. 39). Mutism, paralysis, fear — all read as feminine passivity, the opposite of warrior masculinity. Prior's 'permanent home service' is the ultimate emasculation.",passages:["'being locked up in a loony bin [is possibly] a fairly emasculating experience' (p. 39)","Prior's shame at 'permanent home service' (p. 279)"]},
{id:"s16",label:"Women & the Medusa",colour:"#993556",pale:"#FBEAF0",text:"#4B1528",icon:"🐍",summary:"Sarah's self-reference as Medusa — the feminine gaze that confronts what authority refuses to show.",detail:"When Sarah visits a hospital ward, she references Medusa. Women who witness the full horror of what war has done to men acquire a Medusa-like capacity to see what men in authority refuse to look at. The feminine gaze becomes the one that confronts the truth.",passages:["Sarah's self-reference as Medusa when visiting the hospital (p. 215)","'if the country demanded that price, then it should bloody well be prepared to look at the result.' (p. 215)"]},
{id:"s17",label:"Speech & silence (symbol)",colour:"#444441",pale:"#F1EFE8",text:"#2C2C2A",icon:"🗣",summary:"The axis of speech and silence structures the entire novel — who can speak, what can be said, at what cost.",detail:"Rivers' entire therapeutic method is predicated on speech. Prior recovers his voice through therapy. Sassoon's act of speaking (the Declaration) is silenced by being called madness. Yealland's method restores speech by force and then silences the patient's voice entirely.",passages:["Rivers to Burns: 'If you run now, you'll never stop.' (p. 52) — the internalised voice that cannot be escaped","'Attention, first and foremost; tongue, last and least; questions, never' (p. 302)"]},
{id:"s18",label:"Poetry & power of writing",colour:"#3B6D11",pale:"#EAF3DE",text:"#173404",icon:"📜",summary:"Poetry is testimony, therapy, and protest — the only form that can carry unbearable truth.",detail:"Barker includes Sassoon's actual poems intertextually — they function as documentary evidence. Owen's greatest anti-war poetry emerges from Craiglockhart — creativity as genuine regeneration.",passages:["Sassoon's 'To the Warmongers' (p. 35): denunciation of those who perpetuate dangerous war myths","Owen learning from Sassoon at Craiglockhart — creative recovery"]},
{id:"s19",label:"Old men & civilians at home",colour:"#5F5E5A",pale:"#F1EFE8",text:"#2C2C2A",icon:"👔",summary:"Old men symbolise the callous indifference of the powerful — those who send young men to die and cannot imagine it.",detail:"Sassoon's contempt for anyone who supported the war as motivated by 'selfish motives' (p. 61) crystallises the novel's view of those at home. Burns is handed white feathers in civilian clothes despite his discharge from a war hospital.",passages:["Sassoon: anyone who supported the war 'must be actuated by selfish motives' (p. 61)","Burns handed white feathers in civilian clothes despite his unconditional discharge (p. 233)"]},
{id:"s20",label:"Nurturing & care",colour:"#D4537E",pale:"#FBEAF0",text:"#4B1528",icon:"🌺",summary:"Rivers' therapeutic method aligns him with conventionally feminine values — but caring within an unjust system is not exempt from critique.",detail:"Rivers' approach — listening, empathy, patience — resists the masculine code. But Barker shows that nurturing within an unjust system is not exempt from critique. The novel asks whether Yealland's method is more 'masculine' and what that reveals about how masculinity and care are positioned.",passages:["Rivers' visit to Burns in Suffolk — care beyond institutional duty","Brock's ergotherapy: reconnecting patients to the earth as a nurturing, regenerative act"]},
];

const CHARACTERS=[
{id:"c1",label:"Dr W.H.R. Rivers",colour:"#185FA5",pale:"#E6F1FB",text:"#042C53",icon:"👨‍⚕️",role:"Army psychiatrist at Craiglockhart. Historical figure.",arc:"Confident healer → complicit participant → transformed by his patients",keyPoints:["Empathetic, patient, intellectually rigorous","Emotionally repressed — embodies the masculine code he treats","Believes shell shock is war-caused, not innate weakness — in conflict with Yealland","Grows increasingly unable to sustain the fiction that compassion exempts him from complicity"],quotes:["'the therapy was a test, not only of the genuineness of the individual's symptoms, but also of the validity of the demands the war was making on him.' (p. 156)","'he, who was in the business of changing people, should himself have been changed' (p. 333)","'self-reproach... became the dominant effect' (p. 316)"],essayTip:"Rivers is the moral centre of the novel. The key analytical move: show that his compassion and his complicity coexist — neither cancels the other out. His transformation IS the novel's argument."},
{id:"c2",label:"Siegfried Sassoon",colour:"#3C3489",pale:"#EEEDFE",text:"#26215C",icon:"✍️",role:"Decorated soldier and war poet. Historical figure. At Craiglockhart for his Declaration.",arc:"Principled dissenter → his conviction deepens, not weakens, at Craiglockhart",keyPoints:["Courage is doubled: physical bravery AND moral courage to protest","Aware of class privilege: 'how it sounds' coming from a 'second-lieutenant' (p. 19)","His anti-war hatred is 'more fully fledged and articulate' (p. 334) when he leaves than when he arrived","His sexuality is present obliquely — Carpenter's The Intermediate Sex (p. 73) is his frame"],quotes:["'I am making this statement as an act of wilful defiance of military authority' (p. 5)","'This is the hardest thing I've ever done.' (p. 10)","'Craiglockhart frightened him more than the front had ever done.' (p. 87)"],essayTip:"Don't reduce Sassoon to victim — he is the novel's moral exemplar. His courage is doubled: he denies the psychological need to be 'visibly heroic and hypermasculine' in order to protest. He is the hammer that forges Rivers."},
{id:"c3",label:"Billy Prior",colour:"#534AB7",pale:"#EEEDFE",text:"#26215C",icon:"🪖",role:"Fictional working-class officer. Barker's most complex creation.",arc:"Aggressive self-sufficiency → grudging vulnerability → shame at being denied return to the Front",keyPoints:["Hypermasculinity as defence — aggression conceals profound shame and vulnerability","Class resentment in both directions: his officer class AND his working-class origins","His asthma marks his body as non-conforming to the strong-man ideal","His mutism is a literal enactment of the masculine code: silence as the price of survival"],quotes:["'They owed him something, all of them ...' (p. 172)","'You wouldn't think there was a war on, would you?' (p. 171)","'permanent home service' (p. 279) — source of deep shame"],essayTip:"Prior is fictional — Barker takes greater imaginative licence with him. His class resentment and hypermasculinity are two faces of the same wound. Don't treat him as simply damaged; his aggression is also his refusal to be consumed by the institution."},
{id:"c4",label:"David Burns",colour:"#0F6E56",pale:"#E1F5EE",text:"#04342C",icon:"🌊",role:"Patient at Craiglockhart. Witness to extreme atrocity at the Front.",arc:"Severe trauma → partial stabilisation → discharge but not recovery",keyPoints:["Represents the furthest extreme of what war has done to a human self","Cannot eat without vomiting — the corpse episode has destroyed his relationship with food and the body","Nature both soothes and triggers him simultaneously","Rivers' care for him is the most unconditional in the novel"],quotes:["'a branch [that] rattled along the windows [of the bus] with a sound like machine-gun fire' (p. 51)","'mud-encumbered boots like lead weights pulling on the muscles of his thighs' (p. 51)","'aching thighs remembered, and he listened for the whine of shells' (p. 52)"],essayTip:"Burns' function: to show what war has actually done to a human being — beyond rhetoric and abstraction. His scenes are rendered through sensory detail, not explanation. When teaching close reading, Burns passages demonstrate Barker's embodied trauma technique."},
{id:"c5",label:"Sarah Lumb",colour:"#993556",pale:"#FBEAF0",text:"#4B1528",icon:"⚙️",role:"Working-class munitions factory worker. Prior's romantic interest.",arc:"Expanded wartime agency → awareness that it cannot last",keyPoints:["Represents women's wartime experience: economic independence, autonomy, but precarious","Her anger at the men 'hidden away' is the novel's most direct challenge to the war's refusal to show its cost","Madge warns 'All this won't last' (p. 149) — women know their agency is contingent","Lizzie: her husband's absence has been 'the only little bit of peace [she'd] ever had' (p. 149)"],quotes:["'[women] seemed to have changed so much during the war, to have expanded in all kinds of ways' (p. 123)","'All this won't last' (p. 149)","'if the country demanded that price, then it should bloody well be prepared to look at the result.' (p. 215)"],essayTip:"Don't reduce Sarah to Prior's love interest — she has the novel's most direct feminist voice. Her wartime gains are real but conditional. Her anger in the hospital is the novel's most politically charged moment."},
{id:"c6",label:"Dr Lewis Yealland",colour:"#A32D2D",pale:"#FCEBEB",text:"#501313",icon:"⚡",role:"Psychiatrist at Queen Square. Uses electric shock treatment. Historical figure.",arc:"Present only in the Queen Square sequence — Rivers' foil and unconscious double",keyPoints:["Believes shell shock is weakness, cowardice, or moral failure — not war-caused injury","His method: electric shock, coercion, total authority, no questions","'Attention, first and foremost; tongue, last and least; questions, never' (p. 302) — the exact inversion of Rivers","His 'cures' remove physical symptoms without addressing psychological cause"],quotes:["'Attention, first and foremost; tongue, last and least; questions, never' (p. 302)","Rivers on Yealland's method: 'uncomfortably like an oral rape' (p. 316)"],essayTip:"Yealland is not simply a villain — his method 'works' in the narrow sense. His function is to make visible what Rivers' compassionate method obscures: both men serve the same institutional purpose. The comparison is meant to disturb, not comfort."},
{id:"c7",label:"Dr Arthur Brock",colour:"#3B6D11",pale:"#EAF3DE",text:"#173404",icon:"🌱",role:"Medical Officer at Craiglockhart. Uses ergotherapy. Owen is his patient.",arc:"Supporting character — represents the third treatment approach",keyPoints:["Ergotherapy: 'the way back to health is to re-establish the link between oneself and the earth' (p. 166)","Owen is his patient — Brock's method enables the creative recovery that produces Owen's greatest poetry","His patients are 'ungrounded by the war' — reconnection to earth as regeneration"],quotes:["'the way back to health is to re-establish the link between oneself and the earth' (p. 166)","'ungrounded by the war' (p. 166)"],essayTip:"Brock completes the three-way contrast of treatment approaches. Owen's poetry — produced under Brock's ergotherapy — is one of the novel's most powerful arguments that creative recovery is genuine regeneration."},
{id:"c8",label:"Wilfred Owen",colour:"#854F0B",pale:"#FAEEDA",text:"#412402",icon:"📖",role:"Poet. Patient of Brock's at Craiglockhart. Historical figure.",arc:"Stuttering, uncertain patient → mentored by Sassoon → leaves to write the greatest anti-war poetry in English",keyPoints:["His stammer is the physical marker of his psychological state — and of what he cannot yet say","Admires Sassoon intensely — their relationship is one of the novel's most significant","His poem on Antaeus and Hercules draws parallels between ergotherapy and regeneration","His departure from Craiglockhart begins his greatest creative period — and leads to his death"],quotes:["Owen: Antaeus 'is too strong for Hercules as long as he keeps his feet on mother Earth' (p. 165)"],essayTip:"Owen's presence is a constant reminder that Craiglockhart is historically real — and that what happens there has consequences beyond the novel. His relationship with Sassoon is the creative counterpart to Rivers' therapeutic relationship."},
];

const TABS=["Themes","Symbols","Characters"];
const ALL=[THEMES,SYMBOLS,CHARACTERS];

let state={tab:0,selected:null,search:"",quiz:false,qIdx:0,revealed:false,got:0,missed:0};

function r(html){document.getElementById("app").innerHTML=html;}

function render(){
  const data=ALL[state.tab];
  const filtered=state.search.trim()?data.filter(d=>(d.label+d.summary).toLowerCase().includes(state.search.toLowerCase())):data;
  const qi=state.quiz?data[state.qIdx%data.length]:null;

  let html=`<h2 class="sr-only">Regeneration study tool — themes, symbols and characters</h2>`;

  // header
  html+=`<div style="border-bottom:0.5px solid var(--border);padding-bottom:1rem;margin-bottom:1.25rem">
    <div style="display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap">
      <span style="font-size:18px;font-weight:500;color:var(--text-primary)">Regeneration</span>
      <span style="font-size:14px;color:var(--text-secondary);font-style:italic">Pat Barker — VCE English Unit 4</span>
    </div>
    <p style="margin:.4rem 0 0;font-size:14px;color:var(--text-secondary)">Select a card to explore, or use quiz mode to test yourself.</p>
  </div>`;

  // tabs + controls
  html+=`<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
    <div style="display:flex;gap:.25rem;background:var(--surface-1);border-radius:var(--radius);padding:3px">
  ${TABS.map((t,i)=>`<button onclick="setTab(${i})" style="border:none;cursor:pointer;border-radius:calc(var(--radius) - 2px);padding:6px 14px;font-size:14px;font-weight:${state.tab===i?500:400};background:${state.tab===i?"var(--surface-2)":"transparent"};color:${state.tab===i?"var(--text-primary)":"var(--text-secondary)"};font-family:inherit">${t} <span style="font-size:12px;opacity:.6">(${ALL[i].length})</span></button>`).join("")}
    </div>
    <input placeholder="Search ${TABS[state.tab].toLowerCase()}…" value="${state.search.replace(/"/g,"&quot;")}" oninput="setSearch(this.value)" style="flex:1;min-width:140px;font-size:13px;padding:6px 10px;font-family:inherit;box-sizing:border-box">
    <button onclick="${state.quiz?"exitQuiz()":"startQuiz()"}" style="padding:6px 14px;font-size:13px;cursor:pointer;background:${state.quiz?"var(--bg-danger)":"var(--bg-accent)"};color:${state.quiz?"var(--text-danger)":"var(--text-accent)"};border:0.5px solid ${state.quiz?"var(--border-danger)":"var(--border-accent)"};border-radius:var(--radius);font-family:inherit">${state.quiz?"Exit quiz":"Quiz mode ↗"}</button>
  </div>`;

  // QUIZ
  if(state.quiz && qi){
    html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1.5rem;margin-bottom:1.25rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <span style="font-size:13px;color:var(--text-secondary)">Quiz — ${TABS[state.tab]}</span>
        <span style="font-size:13px;color:var(--text-secondary)"><span style="color:var(--text-success)">✓ ${state.got}</span>&nbsp;&nbsp;<span style="color:var(--text-danger)">✗ ${state.missed}</span></span>
      </div>
      <div style="display:inline-block;padding:4px 10px;border-radius:var(--radius);background:${qi.pale};color:${qi.text};font-size:12px;margin-bottom:.75rem;font-weight:500">${qi.label}</div>
      <p style="margin:0 0 1rem;font-size:15px;font-weight:500;color:var(--text-primary);line-height:1.6">${state.revealed?qi.summary:"What is the significance of this element?"}</p>`;
    if(state.revealed){
      const pts=(qi.keyPoints||qi.keyIdeas||qi.keyTraits||[]).slice(0,3);
      html+=`<p style="font-size:13px;color:var(--text-secondary);margin:0 0 .5rem;font-weight:500">Key points:</p><ul style="margin:0 0 .75rem;padding-left:1.2rem">${pts.map(p=>`<li style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;line-height:1.5">${p}</li>`).join("")}</ul>`;
      const evs=(qi.evidence||qi.passages||qi.quotes||[]).slice(0,1);
      if(evs.length) html+=`<p style="margin:.5rem 0 0;font-size:13px;font-style:italic;color:var(--text-muted);border-left:3px solid ${qi.colour};padding-left:.6rem;line-height:1.5">${evs[0]}</p>`;
    }
    if(!state.revealed){
      html+=`<button onclick="revealQuiz()" style="padding:8px 18px;font-size:14px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-family:inherit">Reveal answer</button>`;
    } else {
      html+=`<div style="display:flex;gap:.5rem;margin-top:.75rem">
        <button onclick="nextQuiz(true)" style="padding:8px 18px;font-size:13px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-success);background:var(--bg-success);color:var(--text-success);font-family:inherit">Got it ✓</button>
        <button onclick="nextQuiz(false)" style="padding:8px 18px;font-size:13px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-danger);background:var(--bg-danger);color:var(--text-danger);font-family:inherit">Missed it ✗</button>
      </div>`;
    }
    html+=`</div>`;
  }

  // CARD GRID
  if(!state.quiz && !state.selected){
    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px">`;
    if(filtered.length===0) html+=`<p style="color:var(--text-secondary);font-size:14px;grid-column:1/-1">No results for "${state.search}".</p>`;
    filtered.forEach(item=>{
      html+=`<button onclick="openCard('${item.id}')" style="border:0.5px solid ${item.colour}30;border-radius:12px;padding:.9rem 1rem;cursor:pointer;text-align:left;background:${item.pale};min-height:95px;font-family:inherit">
        <div style="font-size:18px;margin-bottom:.4rem">${item.icon||"📌"}</div>
        <div style="font-size:13px;font-weight:500;color:${item.text};line-height:1.3">${item.label}</div>
        ${item.role?`<div style="font-size:11px;color:${item.text};opacity:.7;margin-top:4px;line-height:1.3">${item.role}</div>`:""}
      </button>`;
    });
    html+=`</div>`;
  }

  // DETAIL PANEL
  if(!state.quiz && state.selected){
    const item=state.selected;
    html+=`<button onclick="closeCard()" style="font-size:13px;color:var(--text-secondary);background:none;border:none;cursor:pointer;margin-bottom:.75rem;padding:0;font-family:inherit">← Back to ${TABS[state.tab].toLowerCase()}</button>`;
    html+=`<div style="background:${item.pale};border-radius:12px;border:0.5px solid ${item.colour}40;padding:1.25rem 1.5rem;margin-bottom:1rem">
      <div style="display:flex;align-items:flex-start;gap:.75rem">
        <span style="font-size:28px">${item.icon||"📌"}</span>
        <div>
          <h3 style="margin:0;font-size:18px;font-weight:500;color:${item.text}">${item.label}</h3>
          ${item.role?`<p style="margin:.2rem 0 0;font-size:13px;color:${item.text};opacity:.75;font-style:italic">${item.role}</p>`:""}
        </div>
      </div>
      <p style="margin:.75rem 0 0;font-size:14px;color:${item.text};line-height:1.65">${item.summary}</p>
    </div>`;

    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px">`;

    // arc
    if(item.arc){
      html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1rem 1.25rem">
        <p style="margin:0 0 .6rem;font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Character arc</p>
        <p style="margin:0;font-size:14px;font-style:italic;color:${item.text};background:${item.pale};padding:6px 10px;border-radius:var(--radius);line-height:1.5">${item.arc}</p>
      </div>`;
    }

    // key points
    const pts=(item.keyPoints||item.keyIdeas||item.keyTraits||[]);
    if(pts.length){
      html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1rem 1.25rem;grid-column:1/-1">
        <p style="margin:0 0 .6rem;font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Key ideas</p>
        <ul style="margin:0;padding-left:1.2rem">${pts.map(p=>`<li style="font-size:14px;color:var(--text-primary);margin-bottom:6px;line-height:1.6">${p}</li>`).join("")}</ul>
      </div>`;
    }

    // detail
    if(item.detail){
      html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1rem 1.25rem">
        <p style="margin:0 0 .6rem;font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Explanation</p>
        <p style="margin:0;font-size:14px;color:var(--text-primary);line-height:1.65">${item.detail}</p>
      </div>`;
    }

    // quotes / evidence
    const evs=(item.evidence||item.passages||item.quotes||[]);
    if(evs.length){
      html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1rem 1.25rem;grid-column:1/-1">
        <p style="margin:0 0 .6rem;font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Key quotations</p>
        ${evs.map((q,i)=>`<p style="margin:${i>0?".6rem 0 0":"0"};font-size:13px;font-style:italic;color:var(--text-primary);border-left:3px solid ${item.colour};padding-left:.75rem;line-height:1.6">${q}</p>`).join("")}
      </div>`;
    }

    // connects
    if(item.connects){
      html+=`<div style="background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);padding:1rem 1.25rem">
        <p style="margin:0 0 .6rem;font-size:12px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em">Connects to</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${item.connects.map(c=>`<span style="font-size:12px;padding:4px 10px;border-radius:var(--radius);background:${item.pale};color:${item.text};border:0.5px solid ${item.colour}30">${c}</span>`).join("")}</div>
      </div>`;
    }

    // essay tip
    if(item.essayTip){
      html+=`<div style="background:var(--bg-accent);border-radius:12px;border:0.5px solid var(--border-accent);padding:1rem 1.25rem;grid-column:1/-1">
        <p style="margin:0 0 .4rem;font-size:12px;font-weight:500;color:var(--text-accent);text-transform:uppercase;letter-spacing:.05em">Essay tip</p>
        <p style="margin:0;font-size:14px;color:var(--text-accent);line-height:1.65">${item.essayTip}</p>
      </div>`;
    }

    html+=`</div>`;

    // Claude prompts
    const label=item.label;
    const ev=(evs[0]||"").replace(/'/g,"\\'");
    html+=`<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button onclick="sendPrompt('Write a model analytical paragraph about ${state.tab===2?"the character":"the"} ${JSON.stringify(label)} in Regeneration by Pat Barker.')" style="padding:8px 16px;font-size:13px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-family:inherit">Model paragraph ↗</button>
      <button onclick="sendPrompt('Give me 3 essay topic sentences about ${JSON.stringify(label)} in Regeneration for a VCE text response.')" style="padding:8px 16px;font-size:13px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-family:inherit">Topic sentences ↗</button>
      <button onclick="sendPrompt('How does ${JSON.stringify(label)} connect to the themes of paternalism and duty in Regeneration?')" style="padding:8px 16px;font-size:13px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-family:inherit">Explore connections ↗</button>
    </div>`;
  }

  document.getElementById("app").innerHTML=html;
}

function setTab(i){state.tab=i;state.selected=null;state.quiz=false;state.search="";render();}
function setSearch(v){state.search=v;state.selected=null;render();}
function openCard(id){const data=ALL[state.tab];state.selected=data.find(d=>d.id===id)||null;render();}
function closeCard(){state.selected=null;render();}
function startQuiz(){state.quiz=true;state.qIdx=Math.floor(Math.random()*ALL[state.tab].length);state.revealed=false;state.got=0;state.missed=0;render();}
function exitQuiz(){state.quiz=false;render();}
function revealQuiz(){state.revealed=true;render();}
function nextQuiz(ok){
  state.got+=ok?1:0;state.missed+=ok?0:1;
  const n=ALL[state.tab].length;
  state.qIdx=(state.qIdx+1+Math.floor(Math.random()*(n-1)))%n;
  state.revealed=false;render();
}

render();
</script>
